<title>Modo Crecimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#FF6B1A;--brand-d:#C8500C;--brand-l:#FFF0E6;
  --green:#58CC02;--green-d:#46A302;--green-l:#D7FFB8;
  --blue:#1CB0F6;--blue-d:#1899D6;
  --red:#FF4B4B;--red-d:#D33131;
  --gold:#FFC800;--gold-d:#E0A800;
  --purple:#CE82FF;--purple-d:#A568CC;
  --ink:#3C3C3C;--muted:#8A8A8A;--line:#E5E5E5;--bg:#F7F7F7;--card:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Nunito',ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-weight:700;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom));background:var(--bg)}
@media (min-width:700px){body{background:#ECEEF1}.app{box-shadow:0 0 0 2px var(--line)}}

/* Barra superior */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
.appname{font-weight:900;font-size:18px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stats{display:flex;gap:14px;align-items:center;flex:none}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px}
.stat svg{width:24px;height:24px}
.stat.fire{color:#FF9600}.stat.fire.off{color:#AFAFAF}
.stat.gem{color:var(--blue)}
.stat.lvl{color:var(--purple-d)}
.stat.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.3)}}

/* Banda del mes */
.banner{background:var(--brand);color:#fff;padding:18px 18px 24px;border-radius:0 0 28px 28px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.10)}
.banner .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.banner h1{margin:0;font-size:25px;font-weight:900;line-height:1.15}
.banner .sub{font-size:15px;margin-top:4px;opacity:.95}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:900;white-space:nowrap}
.pill svg{width:16px;height:16px}
.bigbar{height:26px;background:rgba(0,0,0,.20);border-radius:999px;overflow:hidden;margin-top:16px;position:relative}
.bigbar>i{display:block;height:100%;background:var(--gold);border-radius:999px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);position:relative;transition:width .7s cubic-bezier(.3,1.4,.5,1);min-width:26px}
.bigbar>i::after{content:"";position:absolute;left:10px;right:10px;top:5px;height:5px;border-radius:9px;background:rgba(255,255,255,.5)}
.bigbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.banner .hint{font-size:12px;margin-top:10px;opacity:.9;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Generales */
.wrap{padding:6px 16px 16px}
.sec-title{font-size:20px;font-weight:900;margin:22px 4px 4px}
.sec-sub{font-size:13px;color:var(--muted);margin:0 4px 12px;font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.bar{height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .5s cubic-bezier(.3,1.3,.5,1);position:relative}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.4)}
.bar.green>i{background:var(--green)}
.bar.gold>i{background:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}

/* Botones 3D */
.btn{border:none;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;color:#fff;background:var(--brand);box-shadow:0 4px 0 var(--brand-d);transform:translateY(0);transition:transform .07s,box-shadow .07s,filter .15s;cursor:pointer;user-select:none;-webkit-user-select:none;line-height:1.1}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--brand-d)}
.btn.block{width:100%;display:block}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.green:active{box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active{box-shadow:0 0 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.red:active{box-shadow:0 0 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.white{background:#fff;color:var(--brand);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.white:active{box-shadow:0 0 0 rgba(0,0,0,.18)}
.btn.done{background:var(--green-l);color:var(--green-d);box-shadow:0 4px 0 #A5ED6E;cursor:default}
.btn.done:active{transform:none;box-shadow:0 4px 0 #A5ED6E}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:13px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:12px;font-weight:800;text-decoration:underline;padding:4px 0;cursor:pointer}

/* Nivel */
.lvlcard{display:flex;align-items:center;gap:14px}
.shield{width:58px;height:62px;flex:none;position:relative}
.shield svg{width:100%;height:100%}
.shield b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900;padding-bottom:4px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.lvlcard .grow{flex:1;min-width:0}
.lvlname{font-size:18px;font-weight:900}
.lvlname small{font-size:13px;color:var(--muted);font-weight:800}

/* Trofeos de racha */
.trofeo-row{display:flex;align-items:center;gap:14px}
.trofeo-row .grow{flex:1;min-width:0}
.trofeo-big{width:64px;height:64px;flex:none;position:relative}
.trofeo-big svg{width:100%;height:100%}
.trofeo-big b{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--red);color:#fff;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 var(--red-d)}
.trofeo-big.off{filter:grayscale(1);opacity:.45}
.vitrina{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:2px solid var(--line);flex-wrap:wrap}
.mini-trofeo{width:46px;text-align:center;font-size:11px;font-weight:900;color:var(--gold-d)}
.mini-trofeo svg{width:36px;height:36px;display:block;margin:0 auto 2px}
.mini-mas{width:46px;height:36px;display:grid;place-items:center;font-weight:900;color:var(--muted)}
@keyframes trofeoIn{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}

/* Desafíos del día */
.ch{display:flex;align-items:center;gap:12px}
.ch .chest{width:62px;height:62px;flex:none;overflow:visible}
.ch .mid{flex:1;min-width:0}
.ch .name{font-weight:900;font-size:16px;margin-bottom:7px;line-height:1.2}
.ch .count{font-size:13px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:8px}
.ch.isdone .name{color:var(--green-d)}
.ch .act{flex:none;min-width:96px}
.ch .act .btn{width:100%;padding:12px 10px;font-size:14px}
@media (max-width:360px){.ch .chest{width:50px;height:50px}.ch .act{min-width:84px}}

/* Cofre */
.chest .lid{transform-box:view-box;transform-origin:9px 31px;transition:transform .35s}
.chest.open .lid{transform:rotate(-34deg) translate(-3px,-3px)}
.chest .inside{opacity:0;transition:opacity .3s}
.chest.open .inside{opacity:1}
.chest .spark{opacity:0;transform-box:fill-box;transform-origin:center}
.chest.anim{animation:chestShake .5s}
.chest.anim .lid{animation:lidPop .95s cubic-bezier(.3,1.6,.5,1)}
.chest.anim .inside{animation:insideIn .95s}
.chest.anim .spark{animation:spark 1.1s .45s}
@keyframes chestShake{0%,100%{transform:none}20%{transform:rotate(-9deg) scale(1.05)}40%{transform:rotate(9deg) scale(1.05)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
@keyframes lidPop{0%,45%{transform:none}100%{transform:rotate(-34deg) translate(-3px,-3px)}}
@keyframes insideIn{0%,45%{opacity:0}100%{opacity:1}}
@keyframes spark{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6) translateY(-8px)}}

/* Tú vs semana pasada */
.vs .players{display:flex;justify-content:space-between;align-items:center;gap:10px}
.player{display:flex;align-items:center;gap:10px}
.player.r{flex-direction:row-reverse;text-align:right}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;flex:none}
.avatar.a{background:var(--brand);box-shadow:0 3px 0 var(--brand-d)}
.avatar.b{background:var(--purple);box-shadow:0 3px 0 var(--purple-d)}
.player .lbl{font-size:12px;color:var(--muted);font-weight:800}
.player .num{font-size:18px;font-weight:900}
.vsbar{display:flex;height:24px;border-radius:999px;overflow:hidden;margin:14px 0 10px;gap:4px}
.vsbar div{height:100%;transition:flex-grow .6s;position:relative;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.vsbar .a{background:var(--brand);border-radius:999px 0 0 999px}
.vsbar .b{background:var(--purple);border-radius:0 999px 999px 0}
.vsmsg{font-size:14px;text-align:center;font-weight:800}

/* Etapas */
.stage{display:flex;align-items:center;gap:12px;padding:12px 0}
.stage+.stage{border-top:2px solid var(--line)}
.stbadge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.stbadge svg{width:24px;height:24px}
.stage.done .stbadge{background:var(--green);box-shadow:0 3px 0 var(--green-d)}
.stage.cur .stbadge{background:var(--brand);box-shadow:0 3px 0 var(--brand-d);color:#fff;font-weight:900;font-size:18px}
.stage.lock .stbadge{background:var(--line);box-shadow:0 3px 0 #CECECE}
.stage .grow{flex:1;min-width:0}
.stage .st-t{font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage .st-d{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.stage.lock .st-t{color:#AFAFAF}
.tag{font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.3px}
.tag.done{background:var(--green-l);color:var(--green-d)}
.tag.cur{background:var(--brand-l);color:var(--brand)}
.tag.lock{background:#F0F0F0;color:#AFAFAF}

/* Formularios */
label.f{display:block;font-size:13px;font-weight:900;color:var(--muted);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.3px}
.inp{width:100%;font-family:inherit;font-weight:700;font-size:16px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#F7F7F7;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--brand);background:#fff}
textarea.inp{min-height:110px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chform{border:2px dashed var(--line);border-radius:16px;padding:4px 12px 12px;margin-top:10px}
input[type=color].inp{height:50px;padding:4px;cursor:pointer}

/* Gráfica e historial */
.chart svg{width:100%;height:auto;display:block}
.hist{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;gap:10px}
.hist+.hist{border-top:2px solid var(--line)}
.hist .v{font-weight:900;font-size:17px}
.hist .d{font-size:13px;color:var(--muted)}
.diff{font-size:12px;font-weight:900;padding:3px 8px;border-radius:8px}
.diff.up{background:var(--green-l);color:var(--green-d)}
.diff.down{background:#FFDFE0;color:var(--red-d)}
.xbtn{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--muted);font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 2px 0 var(--line);flex:none}
.xbtn:active{transform:translateY(2px);box-shadow:none}

/* Ruta */
.phase{position:relative}
.phase-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.node{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:900;font-size:22px;color:#fff}
.node svg{width:28px;height:28px}
.phase.done .node{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.phase.cur .node{background:var(--brand);box-shadow:0 5px 0 var(--brand-d);animation:pulse 2s infinite}
.phase.lock .node{background:var(--line);box-shadow:0 5px 0 #CECECE;color:#AFAFAF}
@keyframes pulse{0%,100%{outline:0 solid transparent}50%{outline:6px solid var(--brand-l)}}
.phase-title{font-weight:900;font-size:17px;line-height:1.2}
.connector{width:6px;height:22px;background:var(--line);margin:-4px 0 6px 28px;border-radius:9px}
.mission{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;user-select:none;-webkit-user-select:none}
.mission+.mission{border-top:2px solid #F2F2F2}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:#fff;box-shadow:0 3px 0 var(--line);transition:all .15s}
.check svg{width:18px;height:18px;opacity:0}
.mission.ok .check{background:var(--green);border-color:var(--green-d);box-shadow:0 3px 0 var(--green-d)}
.mission.ok .check svg{opacity:1}
.mission .mt{flex:1;font-size:15px;line-height:1.3}
.mission.ok .mt{color:var(--muted);text-decoration:line-through}
.mission .del{background:none;border:none;color:#C4C4C4;font-size:18px;font-weight:900;cursor:pointer;padding:4px 6px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .inp{padding:10px 12px;font-size:15px}

/* Navegación */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:30}
.nav .in{display:flex;max-width:520px;width:100%}
.nav button{flex:1;background:none;border:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:900;color:#AFAFAF;cursor:pointer;text-transform:uppercase;letter-spacing:.3px}
.nav .ic{width:50px;height:36px;border-radius:12px;display:grid;place-items:center;border:2px solid transparent;transition:all .15s}
.nav svg{width:26px;height:26px}
.nav button.on{color:var(--brand)}
.nav button.on .ic{background:var(--brand-l);border-color:var(--brand)}

/* XP flotante, toast, modal */
.xpfloat{position:fixed;z-index:300;pointer-events:none;font-weight:900;font-size:24px;color:var(--gold);-webkit-text-stroke:1px var(--gold-d);text-shadow:0 3px 0 var(--gold-d);animation:floatUp 1.3s ease-out forwards;white-space:nowrap}
.xpfloat.neg{color:#BDBDBD;-webkit-text-stroke:1px #9E9E9E;text-shadow:0 3px 0 #9E9E9E}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-100px) scale(1)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3C3C3C;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:800;z-index:250;max-width:calc(100% - 32px);text-align:center;animation:toastIn .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:26px 20px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.3,1.3,.5,1);text-align:center}
.sheet .big{width:90px;height:90px;margin:0 auto 10px}
.sheet .big svg{width:100%;height:100%}
.sheet h2{margin:4px 0 8px;font-size:23px;font-weight:900}
.sheet p{margin:0 0 20px;color:var(--muted);font-size:15px;line-height:1.45}
.sheet .btns{display:grid;gap:12px}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:26px;max-width:420px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.screen{animation:screenIn .25s ease-out}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}}
.warnbar{background:#FFF4D6;color:#8A6500;font-size:13px;padding:10px 16px;text-align:center;font-weight:800}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="top"></header>
  <div id="warn"></div>
  <main id="main"></main>
</div>
<nav class="nav"><div class="in" id="nav"></div></nav>

<script>
(function(){
'use strict';

/* =========================================================
   CONFIGURACIÓN INICIAL (también se puede cambiar desde
   la pestaña Respaldo → "Personalizar mi app")
   ========================================================= */
const DEF_CFG = {
  appName: 'Modo Crecimiento',
  meta: 'Llegar a 1,000 seguidores',
  unidad: 'seguidores',
  etapas: [1000, 2000, 5000],
  desafios: [
    { nombre: 'Publicar 1 video',      meta: 1,  paso: 1, unidad: '' },
    { nombre: '15 minutos de estudio', meta: 15, paso: 5, unidad: 'min' },
    { nombre: 'Leer 10 páginas',       meta: 10, paso: 2, unidad: 'pág' }
  ],
  desafioMes: { nombre: 'Publicar 30 videos', meta: 30, vinculo: 0 }, // vinculo: índice del desafío diario que lo suma (-1 = manual)
  color: '#FF6B1A'
};
const DEF_MIS = [
  ['Definir mi tema y escribir mi bio', 'Publicar 7 días seguidos', 'Encontrar 3 formatos que funcionen', 'Responder todos los comentarios 2 semanas'],
  ['Crear una serie de videos', 'Hacer 1 colaboración', 'Completar el desafío de 30 videos', 'Revisar mis métricas cada domingo'],
  ['Grabar por lotes una vez a la semana', 'Hacer 3 colaboraciones', 'Lanzar algo propio para mi comunidad', 'Tener un sistema de contenido que funcione sin mí']
];
const NIVELES = ['Novato', 'Aprendiz', 'Constante', 'Pro', 'Leyenda'];
const XPV = { paso: 10, completar: 30, perfecto: 50, registro: 40, mision: 25, mes: 100, mesManual: 20, racha: 70 };
const DIAS_TROFEO = 7; // trofeo al llegar a 7 días de racha (y cada 7 días más)
const XP_NIVEL = 300;
const KEY = 'modoCrecimiento_v1';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ---------- utilidades ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const hoyStr = () => ymd(new Date());
const mesStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const fmt = n => Number(n).toLocaleString('es-MX', { maximumFractionDigits: 1 });
const fechaCorta = s => { const d = parseYmd(s); return d.getDate() + ' ' + MESC[d.getMonth()]; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function lunes(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function misionesBase(){ return DEF_MIS.map(f => f.map(t => ({ t, ok: false }))); }

/* ---------- estado ---------- */
function estadoVacio(cfg){
  return {
    v: 1,
    config: cfg ? clone(cfg) : clone(DEF_CFG),
    totalXP: 0,
    xpLog: {},
    activos: [],
    hoy: { fecha: hoyStr(), prog: [0,0,0], perfecto: false },
    mes: { clave: mesStr(), prog: 0, bonus: false },
    registros: [],
    semanasReg: [],
    trofeos: [],
    misiones: misionesBase()
  };
}

function estadoEjemplo(){
  const s = estadoVacio();
  const t = new Date();
  const xp = { 13:40, 12:70, 11:0, 10:60, 9:90, 8:50, 7:0, 6:80, 5:60, 4:70, 3:90, 2:40, 1:75 };
  let total = 0;
  Object.keys(xp).forEach(k => {
    const d = ymd(addDays(t, -Number(k)));
    if (xp[k] > 0) { s.xpLog[d] = xp[k]; s.activos.push(d); total += xp[k]; }
  });
  // hoy: primer desafío hecho y el segundo a medias
  s.hoy.prog = [s.config.desafios[0].meta, s.config.desafios[1].paso, 0];
  const hoyXP = XPV.paso + XPV.completar + XPV.paso;
  s.xpLog[hoyStr()] = hoyXP; s.activos.push(hoyStr());
  s.totalXP = total + hoyXP;
  s.mes.prog = Math.min(s.config.desafioMes.meta - 1, Math.max(1, Math.round(t.getDate() * 0.9)));
  const vals = [420, 485, 540, 610, 690, 760];
  vals.forEach((v, i) => {
    const d = addDays(t, -1 - (vals.length - 1 - i) * 7);
    s.registros.push({ fecha: ymd(d), valor: v });
    s.semanasReg.push(ymd(lunes(d)));
  });
  s.misiones[0][0].ok = true; s.misiones[0][1].ok = true;
  s.trofeos = [{ fecha: hoyStr(), dias: 7 }]; // la racha de ejemplo llega hoy a 7 días
  return s;
}

function normalizar(o){
  if (!o || typeof o !== 'object') return estadoVacio();
  const s = Object.assign(estadoVacio(), o);
  const c = s.config = Object.assign(clone(DEF_CFG), o.config || {});
  c.appName = String(c.appName || DEF_CFG.appName);
  c.meta = String(c.meta || '');
  c.unidad = String(c.unidad || '');
  if (!Array.isArray(c.etapas) || c.etapas.length !== 3 || c.etapas.some(x => !isFinite(+x))) c.etapas = clone(DEF_CFG.etapas);
  c.etapas = c.etapas.map(Number);
  if (!Array.isArray(c.desafios) || c.desafios.length !== 3) c.desafios = clone(DEF_CFG.desafios);
  c.desafios = c.desafios.map(d => {
    const meta = Math.max(1, Math.round(+d.meta) || 1);
    return { nombre: String(d.nombre || 'Desafío'), meta, paso: Math.min(meta, Math.max(1, Math.round(+d.paso) || 1)), unidad: String(d.unidad || '') };
  });
  c.desafioMes = Object.assign(clone(DEF_CFG.desafioMes), c.desafioMes || {});
  c.desafioMes.meta = Math.max(1, Math.round(+c.desafioMes.meta) || 1);
  c.desafioMes.vinculo = Number(c.desafioMes.vinculo);
  if (![-1,0,1,2].includes(c.desafioMes.vinculo)) c.desafioMes.vinculo = 0;
  if (!/^#[0-9a-f]{6}$/i.test(c.color || '')) c.color = DEF_CFG.color;
  s.totalXP = Math.max(0, +s.totalXP || 0);
  if (!s.xpLog || typeof s.xpLog !== 'object' || Array.isArray(s.xpLog)) s.xpLog = {};
  if (!Array.isArray(s.activos)) s.activos = [];
  if (!s.hoy || !Array.isArray(s.hoy.prog) || s.hoy.prog.length !== 3) s.hoy = { fecha: hoyStr(), prog: [0,0,0], perfecto: false };
  s.hoy.prog = s.hoy.prog.map(x => Math.max(0, +x || 0));
  if (!s.mes || typeof s.mes !== 'object') s.mes = { clave: mesStr(), prog: 0, bonus: false };
  s.mes.prog = Math.max(0, +s.mes.prog || 0);
  if (!Array.isArray(s.registros)) s.registros = [];
  s.registros = s.registros.filter(r => r && /^\d{4}-\d{2}-\d{2}$/.test(r.fecha) && isFinite(+r.valor)).map(r => ({ fecha: r.fecha, valor: +r.valor }));
  if (!Array.isArray(s.semanasReg)) s.semanasReg = [];
  if (!Array.isArray(s.trofeos)) s.trofeos = [];
  s.trofeos = s.trofeos.filter(t => t && /^\d{4}-\d{2}-\d{2}$/.test(t.fecha)).map(t => ({ fecha: t.fecha, dias: Math.max(DIAS_TROFEO, +t.dias || DIAS_TROFEO) }));
  if (!Array.isArray(s.misiones) || s.misiones.length !== 3) s.misiones = misionesBase();
  s.misiones = s.misiones.map(f => Array.isArray(f) ? f.filter(m => m && m.t).map(m => ({ t: String(m.t), ok: !!m.ok })) : []);
  return s;
}

let storageOK = true;
function cargar(){
  try { const raw = localStorage.getItem(KEY); if (raw) return normalizar(JSON.parse(raw)); }
  catch (e) { storageOK = false; }
  return null;
}
function guardar(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
  pintarAviso();
}
function pintarAviso(){
  document.getElementById('warn').innerHTML = storageOK ? '' :
    '<div class="warnbar">Este navegador no deja guardar datos. Usa la pestaña Respaldo para copiar tu progreso.</div>';
}

let S = cargar() || estadoEjemplo();
let tab = 'inicio';
let abierto = null;       // índice del cofre que se acaba de abrir (para animar)
let nivelNuevo = null;
const cola = [];          // celebraciones pendientes

function alDia(){
  const h = hoyStr();
  if (S.hoy.fecha !== h) S.hoy = { fecha: h, prog: [0,0,0], perfecto: false };
  const m = mesStr();
  if (S.mes.clave !== m) S.mes = { clave: m, prog: 0, bonus: false };
  S.hoy.prog = S.hoy.prog.map((p, i) => Math.min(p, S.config.desafios[i].meta));
}

/* ---------- XP, nivel, racha ---------- */
const nivelDe = xp => Math.floor(xp / XP_NIVEL) + 1;
const nombreNivel = n => NIVELES[Math.min(n, NIVELES.length) - 1];

function sumarXP(n, el){
  const antes = nivelDe(S.totalXP);
  S.totalXP = Math.max(0, S.totalXP + n);
  const h = hoyStr();
  S.xpLog[h] = Math.max(0, (S.xpLog[h] || 0) + n);
  if (el) flotar(n, el);
  const despues = nivelDe(S.totalXP);
  if (despues > antes) nivelNuevo = despues;
}

function marcarActivo(){ const h = hoyStr(); if (!S.activos.includes(h)) S.activos.push(h); }
function quitarActivoSiVacio(){
  const algo = S.hoy.prog.some((p, i) => p >= S.config.desafios[i].meta);
  if (!algo) S.activos = S.activos.filter(d => d !== hoyStr());
}
function racha(){
  const set = new Set(S.activos);
  let d = new Date(), n = 0;
  if (!set.has(ymd(d))) d = addDays(d, -1);
  while (set.has(ymd(d))) { n++; d = addDays(d, -1); }
  return n;
}
function xpSemana(offset){
  const ini = addDays(lunes(new Date()), offset * 7);
  let t = 0;
  for (let k = 0; k < 7; k++) t += S.xpLog[ymd(addDays(ini, k))] || 0;
  return t;
}

/* ---------- metas por etapas ---------- */
const regs = () => S.registros.slice().sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
const actual = () => { const r = regs(); return r.length ? r[r.length - 1].valor : null; };
const dir = () => { const e = S.config.etapas; return e[2] < e[0] ? -1 : 1; };
const lograda = (meta, v) => v != null && (dir() > 0 ? v >= meta : v <= meta);
function idxActual(){
  const v = actual(), e = S.config.etapas;
  for (let i = 0; i < e.length; i++) if (!lograda(e[i], v)) return i;
  return e.length;
}
function ritmo(){ // cambio por semana, usando los últimos registros
  const r = regs().slice(-5);
  if (r.length < 2) return null;
  const a = r[0], b = r[r.length - 1];
  const sem = (parseYmd(b.fecha) - parseYmd(a.fecha)) / (7 * 864e5);
  if (sem <= 0) return null;
  return (b.valor - a.valor) / sem;
}
function semanasPara(meta){
  const v = actual(), rt = ritmo();
  if (v == null || rt == null) return null;
  const falta = (meta - v) * dir();
  const avance = rt * dir();
  if (falta <= 0) return 0;
  if (avance <= 0) return Infinity;
  return Math.ceil(falta / avance);
}

function rgb(hex){ const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function flotar(n, el){
  const r = el.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'xpfloat' + (n < 0 ? ' neg' : '');
  d.textContent = (n > 0 ? '+' : '−') + Math.abs(n) + ' XP';
  d.style.left = (r.left + r.width / 2) + 'px';
  d.style.top = (r.top - 8) + 'px';
  document.body.appendChild(d);

}
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2600);

function modal(o){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    ${o.icono ? `<div class="big">${o.icono}</div>` : ''}

      <button class="btn block ${o.peligro ? 'red' : 'green'}" data-m="ok">${esc(o.ok || 'Continuar')}</button>
      ${o.cancel ? `<button class="btn block ghost" data-m="no">${esc(o.cancel)}</button>` : ''}
    </div></div>`;
  const cerrar = ok => { ov.remove(); if (ok && o.onOk) o.onOk(); if (o.onClose) o.onClose(); };
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (b) cerrar(b.dataset.m === 'ok');
    else if (e.target === ov && o.cancel) cerrar(false);
  });
  document.body.appendChild(ov);
}

/* ---------- acciones ---------- */
function accion(i, btn){
  alDia();
  const d = S.config.desafios[i], p = S.hoy.prog[i];
  if (p >= d.meta) return;
  const np = Math.min(d.meta, p + d.paso);
  S.hoy.prog[i] = np;
  let xp = XPV.paso; const extra = [];
  if (np >= d.meta) {
    xp += XPV.completar; abierto = i; marcarActivo();
    const rc = racha();
    if (rc > 0 && rc % DIAS_TROFEO === 0 && !S.trofeos.some(t => t.fecha === hoyStr())) {
      S.trofeos.push({ fecha: hoyStr(), dias: rc }); xp += XPV.racha; extra.push('racha');
    }
    const dm = S.config.desafioMes;
    if (dm.vinculo === i) {
      S.mes.prog++;
      if (S.mes.prog >= dm.meta && !S.mes.bonus) { S.mes.bonus = true; xp += XPV.mes; extra.push('mes'); }
    }
    if (!S.hoy.perfecto && S.hoy.prog.every((v, k) => v >= S.config.desafios[k].meta)) {
      S.hoy.perfecto = true; xp += XPV.perfecto; extra.push('perfecto');
    }
  }
  sumarXP(xp, btn);
  guardar(); render(true);
  encolarCelebraciones(extra);
}
function deshacer(i, btn){
  alDia();
  const d = S.config.desafios[i], p = S.hoy.prog[i];
  if (p <= 0) return;
  let xp = -XPV.paso;
  if (p >= d.meta) {
    xp -= XPV.completar;
    if (S.hoy.perfecto) { S.hoy.perfecto = false; xp -= XPV.perfecto; }
    const dm = S.config.desafioMes;
    if (dm.vinculo === i && S.mes.prog > 0) {
      if (S.mes.bonus && S.mes.prog >= dm.meta && S.mes.prog - 1 < dm.meta) { S.mes.bonus = false; xp -= XPV.mes; }
      S.mes.prog--;
    }
  }
  S.hoy.prog[i] = Math.max(0, p - ((p % d.paso) || d.paso));
  quitarActivoSiVacio();
  if (!S.activos.includes(hoyStr()) && S.trofeos.some(t => t.fecha === hoyStr())) {
    S.trofeos = S.trofeos.filter(t => t.fecha !== hoyStr()); xp -= XPV.racha;
  }
  sumarXP(xp, btn);
  guardar(); render(true);
}
function mesManual(btn){
  alDia();
  const dm = S.config.desafioMes;
  S.mes.prog++;
  let xp = XPV.mesManual; const extra = [];
  if (S.mes.prog >= dm.meta && !S.mes.bonus) { S.mes.bonus = true; xp += XPV.mes; extra.push('mes'); }
  sumarXP(xp, btn); guardar(); render(true); encolarCelebraciones(extra);
}
function guardarRegistro(btn){
  const f = document.getElementById('rFecha').value;
  const v = document.getElementById('rValor').value.trim().replace(/,/g, '');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f)) { toast('Elige una fecha.'); return; }
  if (v === '' || !isFinite(+v)) { toast('Escribe tu número de la semana.'); return; }
  const ex = S.registros.find(r => r.fecha === f);
  if (ex) ex.valor = +v; else S.registros.push({ fecha: f, valor: +v });
  const sem = ymd(lunes(parseYmd(f)));
  const extra = [];
  if (!S.semanasReg.includes(sem)) { S.semanasReg.push(sem); sumarXP(XPV.registro, btn); }
  else toast(ex ? 'Registro actualizado.' : 'Guardado. El XP de registro es uno por semana.');
  guardar(); render(true); encolarCelebraciones(extra);
}
function toggleMision(f, m, el){
  const mi = S.misiones[f][m]; if (!mi) return;
  mi.ok = !mi.ok;
  sumarXP(mi.ok ? XPV.mision : -XPV.mision, el);
  guardar(); render(true); encolarCelebraciones([]);
}

function copiarDatos(){
  const ta = document.getElementById('expTxt');
  const txt = ta.value;
  const fallback = () => {
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length); const ok = document.execCommand('copy'); toast(ok ? '¡Datos copiados! Guárdalos en tus notas.' : 'Selecciona el texto y cópialo manualmente.'); }
    catch (e) { toast('Selecciona el texto y cópialo manualmente.'); }
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => toast('¡Datos copiados! Guárdalos en tus notas.'), fallback);
  else fallback();
}
function restaurar(){
  const raw = document.getElementById('impTxt').value.trim();
  if (!raw) { toast('Pega primero el texto de tu respaldo.'); return; }
  let o;
  try { o = JSON.parse(raw); } catch (e) { toast('Ese texto no es un respaldo válido.'); return; }
  if (!o || typeof o !== 'object' || !o.config) { toast('Ese texto no es un respaldo de esta app.'); return; }
  confirmar('¿Restaurar respaldo?', 'Tus datos actuales se reemplazarán por los del respaldo pegado.', 'Sí, restaurar', () => {
    S = normalizar(o); alDia(); guardar(); render(); toast('¡Respaldo restaurado!');
  });
}

function guardarAjustes(){
  const g = id => document.getElementById(id).value.trim();
  const nombre = g('sNombre'), meta = g('sMeta'), unidad = g('sUnidad');
  const et = [g('sE0'), g('sE1'), g('sE2')].map(x => x.replace(/,/g, ''));
  if (!nombre) { toast('Ponle nombre a tu app.'); return; }
  if (et.some(x => x === '' || !isFinite(+x))) { toast('Las 3 metas por etapas deben ser números.'); return; }
  const des = [0,1,2].map(i => ({ nombre: g('sD' + i + 'n'), meta: Math.round(+g('sD' + i + 'm')), paso: Math.round(+g('sD' + i + 'p')), unidad: g('sD' + i + 'u') }));
  for (const d of des) {
    if (!d.nombre) { toast('Cada desafío necesita un nombre.'); return; }
    if (!(d.meta >= 1)) { toast('La cantidad de cada desafío debe ser 1 o más.'); return; }
    if (!(d.paso >= 1) || d.paso > d.meta) { toast('El “suma de a” debe ser entre 1 y la cantidad del desafío.'); return; }
  }
  const mn = g('sMesN'), mm = Math.round(+g('sMesM'));
  if (!mn || !(mm >= 1)) { toast('Revisa el desafío del mes.'); return; }
  const c = S.config;
  c.appName = nombre; c.meta = meta; c.unidad = unidad;
  c.etapas = et.map(Number); c.desafios = des;
  c.desafioMes = { nombre: mn, meta: mm, vinculo: Number(g('sMesV')) };
  c.color = document.getElementById('sColor').value;
  alDia(); guardar(); render(); toast('¡Ajustes guardados!');
}

function vInicio(){
  const c = S.config, dm = c.desafioMes, now = new Date();
  const finMes = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const quedan = finMes - now.getDate() + 1;
  const pm = Math.min(100, S.mes.prog / dm.meta * 100);
  const vinc = dm.vinculo >= 0 ? c.desafios[dm.vinculo] : null;
  const n = nivelDe(S.totalXP), enNivel = S.totalXP % XP_NIVEL;

  const banner = `<section class="banner">
    <div class="row">
      <div><h1>Desafío de ${MESES[now.getMonth()]}</h1><div class="sub">${esc(dm.nombre)}</div></div>
      <div class="pill">${IC.reloj}${quedan === 1 ? 'Último día' : 'Quedan ' + quedan + ' días'}</div>
    </div>
    <div class="bigbar"><i style="width:${pm}%"></i><span>${fmt(S.mes.prog)} / ${fmt(dm.meta)}</span></div>
    <div class="hint">
      <span>${S.mes.prog >= dm.meta ? '¡Desafío del mes logrado! 🏆' : vinc ? 'Se suma solo al completar «' + esc(vinc.nombre) + '»' : 'Súmalo cada vez que avances'}</span>
      ${!vinc ? '<button class="btn white sm" data-act="mesMas">+1</button>' : ''}
    </div>
  </section>`;

  const nivel = `<div class="card lvlcard">
    <div class="shield">${IC.escudo('#CE82FF')}<b>${n}</b></div>
    <div class="grow">
      <div class="lvlname">${nombreNivel(n)} <small>· Nivel ${n}</small></div>
      <div class="bar gold" style="margin:8px 0 6px"><i style="width:${enNivel / XP_NIVEL * 100}%"></i></div>
      <div class="small muted">${fmt(enNivel)} / ${XP_NIVEL} XP para el nivel ${n + 1}</div>
    </div></div>`;

  const desafios = c.desafios.map((d, i) => {
    const p = S.hoy.prog[i], done = p >= d.meta;
    const lbl = d.meta === 1 ? 'Ya lo hice' : '+' + d.paso + (d.unidad ? ' ' + esc(d.unidad) : '');
    return `<div class="card ch${done ? ' isdone' : ''}">
      ${cofre(done, abierto === i)}
      <div class="mid">
        <div class="name">${esc(d.nombre)}</div>
        <div class="bar${done ? ' green' : ''}"><i style="width:${p / d.meta * 100}%"></i></div>
        <div class="count">${fmt(p)} / ${fmt(d.meta)}${d.unidad ? ' ' + esc(d.unidad) : ''}${p > 0 ? `<button class="linkbtn" data-act="undo" data-i="${i}">Deshacer</button>` : ''}</div>
      </div>
      <div class="act">${done ? '<button class="btn done" disabled>¡Hecho!</button>' : `<button class="btn" data-act="hacer" data-i="${i}">${lbl}</button>`}</div>
    </div>`;
  }).join('');

  const a = xpSemana(0), b = xpSemana(-1);
  const tot = a + b;
  const fa = tot ? Math.max(a / tot, 0.08) : 0.5, fb = tot ? Math.max(b / tot, 0.08) : 0.5;
  const diasRest = 7 - ((now.getDay() + 6) % 7) - 1;
  let msg;
  if (a > b) msg = '¡Vas ganando! Le llevas ' + fmt(a - b) + ' XP a tu semana pasada. 💪';
  else if (a === b) msg = a === 0 ? 'Empieza hoy y gánale a tu semana pasada.' : '¡Empate! Un desafío más y le ganas.';
  else msg = 'Te faltan ' + fmt(b - a + 1) + ' XP para superarla' + (diasRest > 0 ? ' · quedan ' + diasRest + (diasRest === 1 ? ' día' : ' días') + ' esta semana.' : ' · ¡hoy es el último día!');
  const vs = `<div class="card vs">
    <div class="players">
      <div class="player"><div class="avatar a">TÚ</div><div><div class="lbl">Esta semana</div><div class="num">${fmt(a)} XP</div></div></div>
      <div class="player r"><div class="avatar b">SP</div><div><div class="lbl">Semana pasada</div><div class="num">${fmt(b)} XP</div></div></div>
    </div>
    <div class="vsbar"><div class="a" style="flex-grow:${fa}"></div><div class="b" style="flex-grow:${fb}"></div></div>
    <div class="vsmsg">${msg}</div></div>`;

  return banner + `<div class="wrap">
    <div class="sec-title">Desafíos del día</div>
    <div class="sec-sub">Se reinician cada día a medianoche. Cada avance da XP.</div>
    ${desafios}
    <div class="sec-title">Trofeos de racha</div>
    <div class="sec-sub">Cada ${DIAS_TROFEO} días seguidos ganas un trofeo y +${XPV.racha} XP.</div>
    ${vTrofeos()}
    <div class="sec-title">Tu nivel</div>
    <div class="sec-sub">Subes de nivel cada ${XP_NIVEL} XP.</div>
    ${nivel}
    <div class="sec-title">Tú contra tu semana pasada</div>
    <div class="sec-sub">Gánale a quien eras hace 7 días.</div>
    ${vs}
    <div class="sec-title">Mis metas por etapas</div>
    <div class="sec-sub">${esc(c.meta || 'Mi meta principal')}</div>
    ${vEtapas()}
  </div>`;
}

function vTrofeos(){
  const rc = racha(), n = S.trofeos.length;
  const ganadoHoy = S.trofeos.some(t => t.fecha === hoyStr());
  const enCiclo = rc % DIAS_TROFEO, prog = ganadoHoy ? DIAS_TROFEO : enCiclo;
  const faltan = DIAS_TROFEO - enCiclo;
  const msg = ganadoHoy ? '¡Ganaste un trofeo hoy! 🏆 Sigue así para el siguiente.'
    : rc === 0 ? 'Completa un desafío hoy para empezar tu racha.'
    : 'Te ' + (faltan === 1 ? 'falta 1 día' : 'faltan ' + faltan + ' días') + ' para tu ' + (n ? 'siguiente trofeo.' : 'primer trofeo.');
  const vitrina = n ? S.trofeos.slice(-6).map(t => `<div class="mini-trofeo" title="${t.dias} días · ${fechaCorta(t.fecha)}">${IC.copa(true)}<span>${t.dias}d</span></div>`).join('') + (n > 6 ? `<div class="mini-mas">+${n - 6}</div>` : '') : '';
  return `<div class="card">
    <div class="trofeo-row">
      <div class="trofeo-big${n ? '' : ' off'}">${IC.copa(n > 0)}${n ? `<b>${n}</b>` : ''}</div>
      <div class="grow">
        <div class="lvlname">${n} ${n === 1 ? 'trofeo' : 'trofeos'} <small>· racha de ${rc} ${rc === 1 ? 'día' : 'días'}</small></div>
        <div class="bar gold" style="margin:8px 0 6px"><i style="width:${prog / DIAS_TROFEO * 100}%"></i></div>
        <div class="small muted">${msg}</div>
      </div>
    </div>
    ${vitrina ? `<div class="vitrina">${vitrina}</div>` : ''}
  </div>`;
}

function vEtapas(){
  const c = S.config, v = actual(), ia = idxActual(), rt = ritmo(), u = c.unidad ? ' ' + esc(c.unidad) : '';
  const filas = c.etapas.map((m, i) => {
    const st = lograda(m, v) ? 'done' : i === ia ? 'cur' : 'lock';
    let det;
    if (st === 'done') det = '¡Meta lograda!';
    else if (v == null) det = 'Registra tu número en la pestaña Registro para calcular cuánto te falta.';
    else {
      const falta = Math.abs(m - v), w = semanasPara(m);
      det = 'Te faltan ' + fmt(falta) + u + '. ';
      if (w == null) det += 'Registra al menos 2 semanas para estimar.';
      else if (w === Infinity) det += 'A tu ritmo actual todavía no avanzas hacia esta meta.';
      else det += 'A tu ritmo (' + (rt * dir() > 0 ? '+' : '') + fmt(Math.round(rt * dir() * 10) / 10) + '/semana) llegarías en ~' + w + (w === 1 ? ' semana.' : ' semanas.');
    }
    const badge = st === 'done' ? IC.check : st === 'cur' ? (i + 1) : IC.candado;
    const tag = st === 'done' ? '<span class="tag done">Lograda</span>' : st === 'cur' ? '<span class="tag cur">En curso</span>' : '<span class="tag lock">Bloqueada</span>';
    return `<div class="stage ${st}"><div class="stbadge">${badge}</div><div class="grow"><div class="st-t">${fmt(m)}${u} ${tag}</div><div class="st-d">${det}</div></div></div>`;
  }).join('');
  return `<div class="card">${v != null ? `<div class="small muted" style="margin-bottom:4px">Hoy vas en <b style="color:var(--ink)">${fmt(v)}${u}</b></div>` : ''}${filas}</div>`;
}

function grafica(){
  const r = regs(), c = S.config;
  if (r.length < 1) return '<div class="center muted small" style="padding:30px 10px">Aún no hay registros. Guarda tu primer número arriba y aquí verás tu gráfica.</div>';
  const W = 340, H = 210, L = 46, R = 14, T = 20, B = 30;
  const ia = idxActual(), sig = ia < 3 ? c.etapas[ia] : null;
  const vals = r.map(x => x.valor); if (sig != null) vals.push(sig);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mn === mx) { mn -= 1; mx += 1; }
  const pv = (mx - mn) * 0.12; mn -= pv; mx += pv;
  const X = i => r.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (r.length - 1);
  const Y = v => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  const corto = v => Math.abs(v) >= 10000 ? fmt(Math.round(v / 100) / 10) + 'k' : fmt(Math.round(v));
  let g = '';
  for (let k = 0; k <= 3; k++) {
    const v = mn + (mx - mn) * k / 3, y = Y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#EFEFEF" stroke-width="2"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#AFAFAF" font-weight="800">${corto(v)}</text>`;
  }
  if (sig != null) {
    const y = Y(sig);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#58CC02" stroke-width="2.5" stroke-dasharray="7 6"/>
      <rect x="${W - R - 92}" y="${y - 21}" width="92" height="17" rx="8" fill="#D7FFB8"/>
      <text x="${W - R - 46}" y="${y - 9}" text-anchor="middle" font-size="11" fill="#46A302" font-weight="900">Meta: ${corto(sig)}</text>`;
  }
  const pts = r.map((x, i) => [X(i), Y(x.valor)]);
  if (pts.length > 1) {
    const area = 'M' + pts.map(p => p.join(',')).join(' L') + ` L${pts[pts.length - 1][0]},${H - B} L${pts[0][0]},${H - B}Z`;
    g += `<path d="${area}" fill="url(#gArea)"/><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 7 : 5}" fill="#fff" stroke="var(--brand)" stroke-width="3.5"/>`).join('');
  const lp = pts[pts.length - 1];
  g += `<text x="${lp[0]}" y="${lp[1] - 13}" text-anchor="${r.length > 1 ? 'end' : 'middle'}" font-size="12" font-weight="900" fill="var(--brand)">${corto(r[r.length - 1].valor)}</text>`;
  const idxs = r.length <= 2 ? r.map((_, i) => i) : [0, Math.floor((r.length - 1) / 2), r.length - 1];
  [...new Set(idxs)].forEach(i => {
    const anchor = r.length === 1 ? 'middle' : i === 0 ? 'start' : i === r.length - 1 ? 'end' : 'middle';
    g += `<text x="${X(i)}" y="${H - 8}" text-anchor="${anchor}" font-size="11" fill="#AFAFAF" font-weight="800">${fechaCorta(r[i].fecha)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de avance"><defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".25"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>${g}</svg>`;
}

function vRegistro(){
  const c = S.config, r = regs().reverse(), u = c.unidad ? ' ' + esc(c.unidad) : '';
  const semYa = S.semanasReg.includes(ymd(lunes(new Date())));
  const hist = r.length ? r.map((x, k) => {
    const prev = r[k + 1];
    let df = '';
    if (prev) { const d = x.valor - prev.valor; if (d !== 0) df = `<span class="diff ${d * dir() > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${fmt(d)}</span>`; }
    return `<div class="hist"><div><div class="v">${fmt(x.valor)}${u} ${df}</div><div class="d">${fechaCorta(x.fecha)} ${parseYmd(x.fecha).getFullYear()}</div></div><button class="xbtn" data-act="delReg" data-f="${x.fecha}" aria-label="Borrar">×</button></div>`;
  }).join('') : '<div class="muted small center" style="padding:12px">Sin registros todavía.</div>';
  return `<div class="wrap screen">
    <div class="sec-title">Registro semanal</div>
    <div class="sec-sub">Una vez por semana anota tu número: ${esc(c.unidad || 'tu avance')}. ${semYa ? 'Ya ganaste el XP de esta semana ✔' : 'Gana +' + XPV.registro + ' XP con tu registro de esta semana.'}</div>
    <div class="card">
      <div class="grid2">
        <div><label class="f" for="rFecha">Fecha</label><input class="inp" type="date" id="rFecha" value="${hoyStr()}"></div>
        <div><label class="f" for="rValor">${esc(c.unidad || 'Número')}</label><input class="inp" type="number" inputmode="decimal" step="any" id="rValor" placeholder="${actual() != null ? fmt(actual()) : '0'}"></div>
      </div>
      <div style="margin-top:16px"><button class="btn block" data-act="guardarReg">Guardar registro</button></div>
    </div>
    <div class="sec-title">Mi avance</div>
    <div class="sec-sub">La línea verde punteada es tu siguiente meta.</div>
    <div class="card chart">${grafica()}</div>
    <div class="sec-title">Historial</div>
    <div class="card" style="padding:8px 16px">${hist}</div>
  </div>`;
}

function vRuta(){
  const c = S.config, v = actual(), ia = idxActual(), u = c.unidad ? ' ' + esc(c.unidad) : '';
  const verbo = dir() > 0 ? 'Llegar a' : 'Bajar a';
  const fases = c.etapas.map((m, f) => {
    const st = lograda(m, v) ? 'done' : f === ia ? 'cur' : 'lock';
    const mis = S.misiones[f] || [];
    const hechas = mis.filter(x => x.ok).length;
    const tag = st === 'done' ? '<span class="tag done">Lograda</span>' : st === 'cur' ? '<span class="tag cur">En curso</span>' : '<span class="tag lock">Bloqueada</span>';
    const lista = mis.map((x, k) => `<div class="mission${x.ok ? ' ok' : ''}" data-act="mision" data-f="${f}" data-m="${k}">
        <div class="check">${IC.check}</div><div class="mt">${esc(x.t)}</div>
        <button class="del" data-act="delMision" data-f="${f}" data-m="${k}" aria-label="Quitar misión">×</button></div>`).join('');
    return `<div class="phase ${st}">
      <div class="phase-head">
        <div class="node">${st === 'done' ? IC.check : st === 'lock' ? IC.candado : f + 1}</div>
        <div style="min-width:0"><div class="small muted" style="font-weight:900;text-transform:uppercase;letter-spacing:.3px">Fase ${f + 1} ${tag}</div>
        <div class="phase-title">${verbo} ${fmt(m)}${u}</div></div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="small muted">Misiones</span><span class="small" style="font-weight:900">${hechas}/${mis.length}</span></div>
        <div class="bar green" style="margin-bottom:6px"><i style="width:${mis.length ? hechas / mis.length * 100 : 0}%"></i></div>
        ${lista || '<div class="small muted" style="padding:10px 0">Sin misiones. Agrega la primera.</div>'}
        <div class="addrow"><input class="inp" id="nm${f}" placeholder="Nueva misión…" maxlength="120"><button class="btn sm" data-act="addMision" data-f="${f}">Agregar</button></div>
      </div>
    </div>${f < 2 ? '<div class="connector"></div>' : ''}`;
  }).join('');
  return `<div class="wrap screen">
    <div class="sec-title">Tu ruta</div>
    <div class="sec-sub">${esc(c.meta || '')} · Cada misión cumplida da +${XPV.mision} XP.</div>
    ${fases}
  </div>`;
}

        </div>

function vNav(){
  const items = [['inicio','Inicio'],['registro','Registro'],['ruta','Ruta'],['respaldo','Respaldo']];
  return items.map(([k, t]) => `<button class="${tab === k ? 'on' : ''}" data-tab="${k}" aria-label="${t}"><span class="ic">${IC[k]}</span>${t}</button>`).join('');
}

function render(keepScroll){
  alDia();
  aplicarMarca();
  const y = window.scrollY;
  document.getElementById('top').innerHTML = vTop();
  const main = document.getElementById('main');
  main.innerHTML = tab === 'registro' ? vRegistro() : tab === 'ruta' ? vRuta() : tab === 'respaldo' ? vRespaldo() : `<div class="screen">${vInicio()}</div>`;
  if (keepScroll) { main.firstElementChild && main.firstElementChild.classList.remove('screen'); window.scrollTo(0, y); }
  document.getElementById('nav').innerHTML = vNav();
  abierto = null;
}

/* ---------- eventos ---------- */
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (tab === b.dataset.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
document.getElementById('main').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'delMision') {
    e.stopPropagation();
    const f = +b.dataset.f, m = +b.dataset.m, mi = S.misiones[f][m];
    confirmar('¿Quitar esta misión?', '“' + mi.t + '” se eliminará de tu ruta.', 'Quitar', () => { S.misiones[f].splice(m, 1); guardar(); render(true); });
    return;
  }
  switch (a) {
    case 'hacer': accion(+b.dataset.i, b); break;
    case 'undo': deshacer(+b.dataset.i, b); break;
    case 'mesMas': mesManual(b); break;
    case 'guardarReg': guardarRegistro(b); break;
    case 'delReg': confirmar('¿Borrar este registro?', 'Se quitará el registro del ' + fechaCorta(b.dataset.f) + '.', 'Borrar', () => { S.registros = S.registros.filter(r => r.fecha !== b.dataset.f); guardar(); render(true); }); break;
    case 'mision': toggleMision(+b.dataset.f, +b.dataset.m, b.querySelector('.check')); break;
    case 'addMision': agregarMision(+b.dataset.f); break;
    case 'copiar': copiarDatos(); break;
    case 'restaurar': restaurar(); break;
    case 'ajustes': guardarAjustes(); break;
    case 'borrar': borrarTodo(); break;
    case 'ejemplo': cargarEjemplo(); break;
  }
});
document.getElementById('main').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('nm')) agregarMision(+e.target.id.slice(2));
  if (e.key === 'Enter' && e.target.id === 'rValor') guardarRegistro(e.target);
});
// Si la app se queda abierta y cambia el día, se reinicia sola
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (S.hoy.fecha !== hoyStr() || S.mes.clave !== mesStr())) { alDia(); guardar(); render(); }
});

alDia();
guardar();
render();
})();
</script>
</body>
</html>
